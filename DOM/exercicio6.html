<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 6 - IMC</title>
    <style>
        body {
            width: 600px;
            margin: 0 auto;
        }
        div { margin-bottom: 10px; }
        .resultado-imc { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Calculadora de IMC</h1>
    <form id="form-imc">
        <div>
            <label for="peso">Peso (kg):</label><br>
            <input type="number" step="0.01" id="peso" required>
        </div>
        <div>
            <label for="altura">Altura (m):</label><br>
            <input type="number" step="0.01" id="altura" required>
        </div>
        <button type="submit">Calcular IMC</button>
    </form>

    <div id="resultado" class="resultado-imc"></div>

    <script>
        const formImc = document.getElementById('form-imc');
        const pesoInput = document.getElementById('peso');
        const alturaInput = document.getElementById('altura');
        const resultadoDiv = document.getElementById('resultado');

        formImc.addEventListener('submit', (e) => {
            e.preventDefault();

            const peso = parseFloat(pesoInput.value);
            const altura = parseFloat(alturaInput.value);

            if (!peso || !altura || altura <= 0) {
                resultadoDiv.textContent = 'Insira valores válidos para peso e altura.';
                return;
            }

            const imc = peso / (altura * altura);
            let classificacao = '';

            if (imc < 18.5) {
                classificacao = 'Abaixo do peso';
            } else if (imc < 25) {
                classificacao = 'Peso normal';
            } else if (imc < 30) {
                classificacao = 'Sobrepeso';
            } else if (imc < 35) {
                classificacao = 'Obesidade grau I';
            } else if (imc < 40) {
                classificacao = 'Obesidade grau II';
            } else {
                classificacao = 'Obesidade grau III (mórbida)';
            }

            resultadoDiv.innerHTML = `Seu IMC é de <strong>${imc.toFixed(2)}</strong> (${classificacao}).`;
        });
    </script>
</body>
</html>
