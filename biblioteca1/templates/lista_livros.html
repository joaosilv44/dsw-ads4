<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Livros</title>
</head>
<body>
    <h1>Biblioteca - Meus Livros</h1>

    <ul>
        {% for livro in livros %}
            <li>
                <strong>{{ livro.titulo }}</strong> - {{ livro.autor }} ({{ livro.ano_publicacao }})
                {% if livro.disponivel %}
                    <span style="color: green;">[Disponível]</span>
                {% else %}
                    <span style="color: red;">[Indisponível]</span>
                {% endif %}
            </li>
        {% empty %}
            <li>Nenhum livro cadastrado.</li>
        {% endfor %}
    </ul>
</body>
</html>
